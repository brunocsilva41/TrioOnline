services:
  # Game Server (Colyseus + Node.js)
  - type: web
    name: trinity-server
    env: node
    plan: free
    buildCommand: pnpm install && cd packages/db && npx prisma generate && cd ../.. && pnpm run build --filter @trinity/core-engine && pnpm run build --filter game-server
    startCommand: node apps/game-server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trinity-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: trinity-redis
          property: connectionString
      - key: PORT
        value: 10000

  # Game Client (Next.js)
  - type: web
    name: trinity-client
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build --filter game-client
    startCommand: pnpm --filter game-client start
    envVars:
      - key: NEXT_PUBLIC_GAME_SERVER_URL
        value: https://trinity-server.onrender.com
      - key: NODE_ENV
        value: production

  # Redis
  - type: redis
    name: trinity-redis
    plan: free
    ipAllowList: []

databases:
  - name: trinity-db
    plan: free
    databaseName: trinity
