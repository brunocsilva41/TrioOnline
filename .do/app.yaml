alerts:
  - rule: DEPLOYMENT_FAILED

features:
  - buildpack-stack=ubuntu-22

services:
  - name: trio-server
    github:
      branch: sobe-nova-visu-a-pedido-dos-fans
      deploy_on_push: true
      repo: brunocsilva41/TrioOnline
    source_dir: .
    build_command: pnpm install && pnpm --filter @trinity/core-engine build && pnpm --filter game-server build
    run_command: node start.js
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 30
      timeout_seconds: 5
      healthy_threshold: 2
      unhealthy_threshold: 5
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: ""
      - key: REDIS_URL
        value: ""

  - name: trio-client
    github:
      branch: sobe-nova-visu-a-pedido-dos-fans
      deploy_on_push: true
      repo: brunocsilva41/TrioOnline
    source_dir: .
    build_command: pnpm install && pnpm --filter game-client build
    run_command: npx next start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
      healthy_threshold: 2
      unhealthy_threshold: 5
    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_GAME_SERVER_URL
        value: wss://api.triodagalera.codes
