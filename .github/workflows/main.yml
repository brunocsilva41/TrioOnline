name: TRINITY_CI_PIPELINE

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trinity_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint & Type Check
        run: |
          pnpm run lint
          pnpm run type-check

      - name: Prisma Generate & Migrate
        run: |
          pnpm run db:generate
          pnpm exec prisma migrate reset --force
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"

      - name: Run Unit Tests (Engine & Matchmaking)
        run: pnpm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests (Usability & Sync)
        run: pnpm run test:e2e
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"
          NEXT_PUBLIC_GAME_SERVER_URL: "ws://localhost:2567"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
