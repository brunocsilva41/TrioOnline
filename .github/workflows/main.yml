name: TRINITY_CI_PIPELINE

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-assurance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trinity_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint & Type Check
        run: |
          pnpm run lint || true
          pnpm run type-check || true

      - name: Prisma Generate
        run: pnpm run db:generate || true
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"

      - name: Run Unit Tests
        run: pnpm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"
          NEXT_PUBLIC_GAME_SERVER_URL: "ws://localhost:2567"
