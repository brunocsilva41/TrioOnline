name: TRINITY_CI_PIPELINE

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trinity_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # Atualizado para v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint & Type Check
        run: |
          pnpm run lint --if-present
          pnpm run type-check --if-present

      - name: Prisma Generate & Migrate
        run: |
          pnpm run db:generate --if-present
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"

      - name: Run Unit Tests
        run: pnpm run test --if-present
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"

      - name: Run E2E Tests
        run: pnpm run test:e2e --if-present
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trinity_test"
          NEXT_PUBLIC_GAME_SERVER_URL: "ws://localhost:2567"
