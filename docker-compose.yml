# docker-compose.yml (Infra-only para Desenvolvimento)
services:
  trinity-db:
    image: postgres:15-alpine
    container_name: trinity-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trinity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  trinity-redis:
    image: redis:7-alpine
    container_name: trinity-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
