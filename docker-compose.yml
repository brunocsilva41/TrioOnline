# build/docker-compose.yml (Raiz)
services:
  trinity-db:
    image: postgres:15-alpine
    container_name: trinity-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trinity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  trinity-redis:
    image: redis:7-alpine
    container_name: trinity-redis
    ports:
      - "6379:6379"

  game-server:
    build: 
      context: .
      dockerfile: apps/game-server/Dockerfile
    container_name: trinity-game-server
    depends_on:
      - trinity-db
      - trinity-redis
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@trinity-db:5432/trinity?schema=public
      - REDIS_URL=redis://trinity-redis:6379
      - PORT=2567
    ports:
      - "2567:2567"

volumes:
  postgres_data:
