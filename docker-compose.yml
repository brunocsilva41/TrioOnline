version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trio-postgres
    restart: always
    environment:
      POSTGRES_DB: triodb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trio-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    container_name: trio-game-server
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/triodb
      REDIS_URL: redis://redis:6379
      PORT: 2567
    ports:
      - "2567:2567"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
